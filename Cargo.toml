[package]
name = "Krustacean"
version = "0.2.2"
edition = "2024"
description = "A transparent proxy for UDP & TCP"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/PalSubham/Krustacean"
links = "cap"

[dependencies]
tokio = { version = "1.48", features = [ "rt-multi-thread", "io-util", "net", "macros", "signal", "sync", "fs", "time" ] }
socket2 = "0.6"
log = "0.4"
log4rs = "1.4"
nix = { version = "0.30", features = [ "uio", "net" ] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
sd-notify = "0.4"
const_format = "0.2"
arc-swap = "1.8"
moka = { version = "0.12", features = [ "future" ] }
bytes = "1.11"

[build-dependencies]
bindgen = "0.72"

[dev-dependencies]
serial_test = "3.3"
tempfile = "3.24"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
